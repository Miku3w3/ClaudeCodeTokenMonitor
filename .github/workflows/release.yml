name: Release Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Secrets cannot be referenced in step-level `if:`; expose them via env instead.
      MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_PUBLISHER_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi

      - name: Run tests
        run: npm test

      # vsce runs "vscode:prepublish" (= npm run compile) automatically before packaging.
      - name: Package .vsix
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          npx --yes @vscode/vsce@3.9.2 package --out "release/claude-code-token-monitor-${VERSION}.vsix"
          echo "VSIX=release/claude-code-token-monitor-${VERSION}.vsix" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Extract release notes
        run: node scripts/release-notes.js "$VERSION" > release/notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          body_path: release/notes.md
          files: ${{ env.VSIX }}
          fail_on_unmatched_files: true

      - name: Publish to Marketplace
        if: ${{ env.MARKETPLACE_TOKEN != '' }}
        env:
          VSCE_PAT: ${{ env.MARKETPLACE_TOKEN }}
        run: npx --yes @vscode/vsce@3.9.2 publish --packagePath "$VSIX" --skip-duplicate

      - name: Notice when Marketplace publishing is not configured
        if: ${{ env.MARKETPLACE_TOKEN == '' }}
        run: echo "::notice::MARKETPLACE_PUBLISHER_TOKEN is not set — the .vsix was released on GitHub only."